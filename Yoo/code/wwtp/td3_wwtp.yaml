# 원본 FCSRL hyper_params/TD3Repr_Lag.yaml 에서 env 와 비용 한도(10 에서 15, 하루 287 스텝 기준)만 바꿨다
agent:
  discount_gamma: 0.99
  feasibility_discount: 0.9
  rew_norm: false
  soft_update_tau: 0.05
  explore_noise_std: 0.05
  policy_noise: 0.2
  noise_clip: 0.5
  update_actor_freq: 2
  nstep_return: 10
  unroll_length: 4
  obs_normalizer: MeanStdNormalizer
network:
  z_dim: 64
  actor_lr: 0.0003
  critic_lr: 0.0003
  encoder_lr: 0.0003
  actor_hidden_dim:
  - 256
  - 256
  encoder_hidden_dim:
  - 256
  - 256
  r_critic_hidden_dim:
  - 256
  - 256
  c_critic_hidden_dim:
  - 256
  - 256
  discrete_n_buckets: 63
  discrete_range:
  - -2.0
  - 4.0
  repr_type: FCSRL
env:
  name: AerationEnv
  num_env_train: 8
  num_env_test: 10
  max_episode_len: 287
trainer:
  replay_size: 200000
  warmup_episode: 16
  epoch: 25
  grad_step_per_epoch: 2500
  collect_len_per_step: 32
  batch_size: 256
  test_episode: 10
  writer_dir: unused
  model_dir: unused
Lagrangian:
  init_lagrg: 0.0
  KP: 0.02
  KI: 0.005
  KD: 0.01
  max_lambda: 0.75
  constraint_threshold: 15
  update_by_J: true
  schedule_threshold: false
  threshold_start: 200
  threshold_end: 15
  schedule_epoch: 5
misc:
  seed: 1000
  cudaid: -1
  render: 0.0
  test: false
