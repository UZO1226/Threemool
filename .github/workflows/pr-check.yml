name: PR 검사

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수정 범위 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_scope.py "$HEAD_REF" "origin/$BASE_REF"
      - name: 논문 통합 시험
        run: |
          pip install lxml
          python scripts/build_paper.py --out "$RUNNER_TEMP/paper.md"
          python scripts/build_hwpx.py --md "$RUNNER_TEMP/paper.md" --out "$RUNNER_TEMP/paper.hwpx"
